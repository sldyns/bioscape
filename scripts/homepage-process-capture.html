<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Homepage process motion capture</title>
  </head>
  <body>
    <h1>Real process motion capture</h1>
    <p id="status">Ready. Start the local capture sink, then record.</p>
    <button id="record">Record three real process clips</button>
    <div id="fixture"></div>
    <div id="review"></div>
    <style>
      body {
        margin: 20px;
        background: #f5f5f7;
        font: 14px system-ui;
        color: #24343d;
      }
      #fixture {
        width: 640px;
        height: 400px;
        position: relative;
      }
      .process-scene-shell,
      .process-canvas {
        position: absolute;
        inset: 0;
      }
      .process-canvas > canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .process-model-labels,
      .process-annotation-key {
        display: none;
      }
      #review {
        display: grid;
        gap: 24px;
      }
      video {
        width: 640px;
        height: 400px;
      }
      .samples {
        display: flex;
        gap: 8px;
      }
      .samples img {
        width: 320px;
        height: 200px;
      }
    </style>
    <script type="module" src="./homepage-process-capture.jsx"></script>
  </body>
</html>

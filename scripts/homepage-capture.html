<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Homepage model capture</title>
  </head>
  <body>
    <p id="status">Preparing real model captures…</p>
    <div id="fixture"></div>
    <div id="images"></div>
    <style>
      body {
        margin: 0;
        background: #f5f5f7;
        font: 14px system-ui;
      }
      #fixture {
        width: 800px;
        height: 800px;
        position: absolute;
        left: 0;
        top: 60px;
      }
      .model-canvas {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .model-label-list,
      .label-leaders,
      .model-pin,
      .model-hover {
        display: none;
      }
      #images {
        position: relative;
        display: grid;
        grid-template-columns: repeat(3, 250px);
        gap: 8px;
        background: #f5f5f7;
      }
      #images img {
        width: 250px;
        height: 250px;
        object-fit: contain;
      }
      #images figure {
        margin: 0;
      }
      #images figcaption {
        text-align: center;
      }
    </style>
    <script type="module" src="./homepage-capture.jsx"></script>
  </body>
</html>

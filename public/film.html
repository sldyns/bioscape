<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f7" />
    <title>BioScape — A closer look at life.</title>
    <meta
      name="description"
      content="A closer look at life. A film about biological structures and processes, created by Kun Qian."
    />
    <meta property="og:title" content="BioScape — A closer look at life." />
    <meta property="og:type" content="video.other" />
    <meta
      property="og:image"
      content="https://sldyns.github.io/bioscape/media/cover-en.jpg"
    />
    <meta
      property="og:url"
      content="https://sldyns.github.io/bioscape/film.html"
    />
    <style>
      * {
        box-sizing: border-box;
      }
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #253039;
        background: #f5f5f7;
      }
      body {
        margin: 0;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:hover {
        color: #4d8074;
      }
      a:focus-visible {
        outline: 2px solid #4d8074;
        outline-offset: 6px;
        border-radius: 4px;
      }
      header,
      main,
      footer {
        width: min(1160px, calc(100% - 64px));
        margin: auto;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 30px 0;
        border-bottom: 1px solid #dfe2e5;
      }
      .brand {
        font-size: 24px;
        font-weight: 650;
        letter-spacing: -1px;
      }
      nav {
        display: flex;
        gap: 26px;
        font-size: 14px;
        color: #65737b;
      }
      .intro {
        padding: 64px 0 32px;
      }
      .eyebrow {
        color: #688e85;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 2px;
      }
      h1 {
        font-size: clamp(30px, 4vw, 48px);
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -1.5px;
        margin: 18px 0 14px;
      }
      .subtitle {
        color: #73808a;
        font-size: 18px;
        margin: 0;
      }
      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #f5f5f7;
        border-radius: 16px;
        box-shadow: 0 18px 64px #25303912;
      }
      .caption {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        font-size: 12px;
        line-height: 1.8;
        color: #7a858e;
        margin: 20px 2px;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 28px;
        padding: 15px 24px;
        border-radius: 99px;
        background: #283c38;
        color: #fff;
        font-size: 15px;
        margin: 12px 0 64px;
      }
      .cta:hover {
        background: #3e5a52;
        color: #fff;
      }
      footer {
        border-top: 1px solid #dfe2e5;
        padding: 26px 0 38px;
        display: flex;
        justify-content: space-between;
        gap: 20px;
        font-size: 12px;
        color: #7a858e;
        line-height: 1.8;
      }
      @media (max-width: 600px) {
        header,
        main,
        footer {
          width: calc(100% - 36px);
        }
        header {
          padding: 24px 0;
        }
        .intro {
          padding-top: 42px;
        }
        nav {
          gap: 16px;
          font-size: 12px;
        }
        .caption,
        footer {
          flex-direction: column;
          gap: 8px;
        }
        video {
          border-radius: 9px;
        }
        .cta {
          margin-bottom: 42px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="./">BioScape</a>
      <nav aria-label="Links">
        <a id="language" href="?lang=zh" lang="zh-CN">中文</a>
        <a href="https://github.com/sldyns/bioscape">GitHub ↗</a>
      </nav>
    </header>
    <main>
      <div class="intro">
        <div class="eyebrow" id="eyebrow">THE BIOSCAPE FILM</div>
        <h1 id="heading">A closer look at life.</h1>
        <p class="subtitle" id="subtitle">
          Explore the structures and processes of life.
        </p>
      </div>
      <video
        controls
        playsinline
        preload="metadata"
        poster="media/cover-en.jpg"
        aria-label="BioScape film in English"
      >
        <source src="media/bioscape-en.mp4" type="video/mp4" />
        <track
          kind="captions"
          src="media/film.en.vtt"
          srclang="en"
          label="English"
        />
        <p><a href="media/bioscape-en.mp4">Download the film</a></p>
      </video>
      <div class="caption">
        <span id="credit">A film by Kun Qian</span>
        <a id="download" href="media/bioscape-en.mp4" download>Download ↓</a>
      </div>
      <a class="cta" href="./"
        ><span id="explore">Explore BioScape</span
        ><span aria-hidden="true">→</span></a
      >
    </main>
    <footer>
      <span>© 2026 <a href="https://sldyns.github.io/">Kun Qian</a></span>
      <a id="license" href="LICENSE.txt"
        >Noncommercial use · Commercial licensing by permission</a
      >
    </footer>
    <script>
      const zh = new URLSearchParams(location.search).get("lang") === "zh";
      if (zh) {
        document.documentElement.lang = "zh-CN";
        document.title = "BioScape · 看见微观，理解生命";
        const labels = {
          eyebrow: "生物图景 · 介绍片",
          heading: "看见微观。理解生命。",
          subtitle: "从结构，走进生命的过程。",
          credit: "Kun Qian 创作",
          download: "下载影片 ↓",
          explore: "开始探索",
          license: "非商业使用许可 · 商用须经授权",
          language: "English",
        };
        for (const [id, text] of Object.entries(labels))
          document.getElementById(id).textContent = text;
        const language = document.getElementById("language");
        language.href = "?lang=en";
        language.lang = "en";
        const video = document.querySelector("video");
        video.poster = "media/cover-zh.jpg";
        video.setAttribute("aria-label", "BioScape 中文介绍片");
        video.querySelector("source").src = "media/bioscape-zh.mp4";
        const track = video.querySelector("track");
        track.src = "media/film.zh.vtt";
        track.srclang = "zh-CN";
        track.label = "中文";
        const fallback = video.querySelector("a");
        fallback.href = "media/bioscape-zh.mp4";
        fallback.textContent = "下载影片";
        document.getElementById("download").href = fallback.href;
        video.load();
      }
    </script>
  </body>
</html>
